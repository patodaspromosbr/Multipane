<label class="l">Ingredientes (marcados = usados)</label>${he.i.map((x,j)=>`<div class="ing"><input type="checkbox" ${x[1]?'checked':''} onchange="he.i[${j}][1]=this.checked"><input type="text" value="${esc(x[0])}" oninput="he.i[${j}][0]=this.value"><button class="x" onclick="he.i.splice(${j},1);rHE()">×</button></div>`).join('')}
<div class="row" style="margin-top:8px"><input type="text" id="hn" placeholder="Novo ingrediente" onkeydown="if(event.key=='Enter')addHEI()"><button class="btn" onclick="addHEI()">＋</button></div>
<label class="l">OBSERVAÇÕES</label><textarea oninput="he.o=this.value">${esc(he.o||'')}</textarea>
<div class="bar"><button class="btn" onclick="saveHE()">SALVAR ALTERAÇÕES</button></div>`}
function addHEI(){const v=$('#hn').value.trim();if(!v)return;he.i.push([v,false]);rHE();$('#hn').focus()}
function saveHE(){if(!he.n.trim())return toast('A receita precisa de um nome');const h=LS.get('mp_hist',[]),old=h[hi];h[hi]=he;if(!LS.set('mp_hist',h)){h[hi]=old;return toast('Não foi possível salvar')}toast('Registro atualizado ✔');location.hash='#/hist'}

function vConv(){const T2=[[240,"1",16,48],[210,"7/8",14,42],[180,"3/4",12,36],[150,"5/8",10,30],[120,"1/2",8,24],[90,"3/8",6,18],[60,"1/4",4,12],[30,"1/8",2,6],[15,"",1,3]];
A.innerHTML=`${back}<h1>Tabela de conversão de medidas</h1><div class="card"><b>Medida do manual (pág. 17)</b>Para farinha de trigo, utilize o copo Britânia cheio (<b>240 ml</b>) e a colher medidora Britânia.</div>
<p class="small">O arquivo do manual enviado não traz o quadro de conversão (a página "Instrumentos medidores" não veio no texto). Abaixo, uma <b>referência padrão</b> baseada no copo de 240 ml — não é do manual:</p>

function vHow(){A.innerHTML=`${back}<h1>Como utilizar a Panificadora Multi Pane</h1><div class="how">
<h2>Teclas e display</h2><ul><li><b>COR:</b> escolhe a cor do pão (claro, médio ou escuro).</li><li><b>OPÇÕES:</b> seleciona o ciclo indicado na receita (1 = Normal, 2 = Francês, 3 = Integral…). Use sempre o ciclo indicado.</li><li><b>QUANTIDADE DE MASSA:</b> Opção I (450 g e 600 g) ou Opção II (900 g e 1200 g).</li><li><b>Setas de tempo / TIMER:</b> programam a hora em que o pão ficará pronto (retarda o preparo em até 13 horas).</li><li><b>INICIAR/PARAR:</b> toque breve para ligar (luz vermelha acende); para desligar, pressione até a luz apagar e soar o bip.</li></ul>
<h2>Utilização</h2><ol>
<li><b>As peças:</b> reúna panificadora, forma, batedor e instrumentos de medida.</li>
<li><b>A forma:</b> remova-a girando levemente em sentido anti-horário até desencaixar. Lave com esponja macia e detergente neutro, enxágue e seque.</li>
<li><b>O batedor:</b> encaixe-o na forma. Os ingredientes devem ser colocados na forma ainda fora do aparelho, para não caírem no forno e na resistência.</li>
<li><b>As medidas:</b> use sempre medidas exatas. Ao medir secos, não pegue a farinha diretamente com o copo: encha o copo com uma colher, ultrapassando a borda, bata a colher ao lado do copo para tirar bolhas de ar e remova o excesso com uma espátula.</li>
<li><b>Os ingredientes:</b> use sempre ingredientes frescos e de boa qualidade, seguindo a ordem da receita: primeiro os líquidos, em seguida os sólidos e, por último, o fermento.</li>
<li><b>Preparando uma receita:</b> meça os ingredientes com atenção.</li>
<li><b>Colocando a forma:</b> ajuste a forma no aparelho, fixando-a e girando em sentido horário até encaixar. Feche a tampa.</li>
<li><b>Programando:</b> ao ligar na tomada, o display acende e emite um sinal sonoro. Escolha o ciclo em OPÇÕES, o tamanho em QUANTIDADE DE MASSA e a cor em COR; pressione INICIAR/PARAR.</li>
<li><b>Início do preparo:</b> o display mostra a contagem regressiva até o pão ficar pronto.</li>
<li><b>Término do preparo:</b> soa um bip e o display mostra 0:00. Retire o pão logo após o bip final para ficar mais saboroso e crocante; se não, a panificadora mantém o pão quente por uma hora. Com pano ou luvas térmicas, segure a forma virada para baixo e balance até o pão soltar. Se o batedor ficar no pão, retire-o com o gancho.</li>
<li><b>Após o preparo:</b> deixe o pão descansar 15 minutos antes de cortar. Para outra fornada, deixe a tampa aberta e aguarde 20 minutos até esfriar. Depois de usar, retire da tomada.</li></ol>
<h2>Dicas importantes</h2><ul><li>Ingredientes muito quentes ou muito gelados alteram o crescimento da massa.</li><li>Para melhores resultados, os ingredientes devem estar a cerca de 23 °C.</li><li>O fermento não deve ter contato com a água nem com o sal: coloque-o no meio da farinha, num "buraco".</li><li>Observe a validade dos ingredientes, especialmente fermento e farinha.</li><li>Use o aparelho em ambientes entre 20 °C e 27 °C.</li></ul>
<h2>Como acertar o ponto da massa</h2><p>Após 5 ou 6 minutos do início, abra a tampa: a massa deve ser uma bola homogênea. Se estiver mole (gruda na forma), acrescente 1 colher (sopa) de farinha ou mais. Se estiver disforme (dura), acrescente 1 colher (chá) de água ou mais.</p></div>`}

function vTimer(){const o=all().flatMap(r=>r.w.flatMap((w,i)=>r.c.map((c,ci)=>`<option value="${r.id}|${i}|${ci}">${esc(r.n)} – ${esc(w[0])}${r.c.length>1?' – ciclo '+c:''}</option>`))).join('');
A.innerHTML=`${back}<h1>Timer</h1><p class="mut" style="margin:0">Hora atual do celular</p><div class="clock" id="ck"></div>
<label class="l">Hora em que o ciclo deve terminar</label><input type="time" id="te" oninput="calc()">
<label class="l">Receita (opcional, confere o tempo mínimo e perecíveis)</label><select id="tr" onchange="calc()"><option value="">— nenhuma —</option>${o}</select>
<div id="rs"></div><p class="small" style="margin-top:16px">O TIMER adia o preparo em até 13 horas. O tempo programado no visor é o tempo até o pão ficar pronto (inclui o preparo). Em dias muito quentes, reduza a água em 1 ou 2 colheres (sopa). O fermento não pode tocar a água nem o sal até a mistura começar. Não use o Timer com leite, ovos ou outros perecíveis.</p>`;
const t=()=>{$('#ck').textContent=new Date().toLocaleTimeString('pt-BR');calc()};t();iv=setInterval(t,1000)}
function calc(){const v=$('#te')&&$('#te').value,R2=$('#rs');if(!v){R2.innerHTML='';return}
const[h,m]=v.split(':').map(Number),n=new Date(),e=new Date(n);e.setHours(h,m,0,0);if(e<=n)e.setDate(e.getDate()+1);
const d=(e-n)/60000,day=x=>x.toDateString()==n.toDateString()?'hoje':'amanhã';let out='',sel=$('#tr').value,rc=null;
if(sel){const[id,i,ci]=sel.split('|'),r=find(id);rc={r,w:r.w[i],c:r.c[+ci||0]}}
if(rc){const mn=tot(rc.c,opt(rc.w[0]));if(d<mn){R2.className='res err';R2.innerHTML=`<b>Tempo insuficiente.</b> ${esc(rc.r.n)} leva ${hm(mn)}h; faltam só ${hm(d)}h até ${v}. Escolha um horário final mais tarde.`;return}}
const disp=d>780?780:Math.max(10,Math.round(d/10)*10);
if(d>780){const s=new Date(e-780*60000);out=`⏳ O TIMER aceita no máximo 13h. <b>Inicie a programação às ${hhmm(s)} (${day(s)})</b> e programe <b>13:00</b> no visor. O pão ficará pronto às ${v} (${day(e)}).`}
else{const f=new Date(n.getTime()+disp*60000);out=`▶ <b>Programe agora</b> o visor para <b>${hm(disp)}</b> (faltam ${hm(d)}h até ${v}; ajuste com as setas até o valor mais próximo) e pressione INICIAR/PARAR. Pronto às ~${hhmm(f)} (${day(f)}).`}
if(rc){const t=rc.w[1].join(' ').toLowerCase().replace(/leite em pó|leite de coco|leite condensado/g,'');if(/ovo|leite|queijo|creme|iogurte|requeijão|calabresa|peru|nata|gema/.test(t))out+=`<br><br>⚠️ Esta receita tem ingredientes perecíveis (ovos/leite etc.): o manual diz para <b>não usar o TIMER</b>.`}
R2.className='res';R2.innerHTML=out}

const WL=['450g','600g','900g','1200g','Único'];
function vEdit(id){if(id!==undefined){const r=id=='new'?null:LS.get('mp_custom',[]).find(x=>x.id==id);ed=r?{id:r.id,n:r.n,c:r.c[0],ws:r.w.map(w=>({l:w[0],i:w[1].slice()})),cur:0}:{id:null,n:'',c:1,ws:[{l:'900g',i:[]}],cur:0}}rEd()}
function rEd(){const w=ed.ws[ed.cur];A.innerHTML=`<a class="back" href="#/home">← Cancelar</a><h1>${ed.id?'Editar':'Nova'} receita</h1>
<label class="l">Nome</label><input type="text" value="${esc(ed.n)}" oninput="ed.n=this.value">
<label class="l">Ciclo de programação</label><select onchange="ed.c=+this.value">${CY.slice(1).map((n,i)=>`<option value="${i+1}" ${ed.c==i+1?'selected':''}>${i+1} – ${n}</option>`).join('')}</select>
<label class="l">Pesos disponíveis</label><div class="chips">${WL.map(l=>`<button class="chip ${ed.ws.some(x=>x.l==l)?'on':''}" onclick="togW('${l}')">${l}</button>`).join('')}</div>
<label class="l">Editando o peso:</label><div class="chips">${ed.ws.map((x,i)=>`<button class="chip ${i==ed.cur?'on':''}" onclick="ed.cur=${i};rEd()">${x.l}</button>`).join('')}</div>
<label class="l">Ingredientes – ${w.l}</label>${w.i.map((t,j)=>`<div class="ing"><span style="flex:1">${esc(t)}</span><button class="x" onclick="ed.ws[ed.cur].i.splice(${j},1);rEd()">×</button></div>`).join('')}
<div class="row" style="margin-top:8px"><input type="text" id="ni" placeholder="Ex.: 2 copos de farinha" onkeydown="if(event.key=='Enter')addI()"><button class="btn" onclick="addI()">＋</button></div>
<p class="small">O tempo total é definido pelo ciclo escolhido (manual, pág. 6–7).</p>
<div class="bar"><button class="btn" onclick="saveEd()">SALVAR RECEITA</button></div>`}
function togW(l){const i=ed.ws.findIndex(x=>x.l==l);if(i>=0){if(ed.ws.length>1){ed.ws.splice(i,1);ed.cur=0}}else{ed.ws.push({l,i:[]});ed.ws.sort((a,b)=>WL.indexOf(a.l)-WL.indexOf(b.l));ed.cur=ed.ws.findIndex(x=>x.l==l)}rEd()}
function addI(){const v=$('#ni').value.trim();if(!v)return;ed.ws[ed.cur].i.push(v);rEd();$('#ni').focus()}
function saveEd(){if(!ed.n.trim())return toast('Dê um nome à receita');if(ed.ws.some(w=>!w.i.length))return toast('Inclua ingredientes em todos os pesos');
const rec={id:ed.id||'u'+Date.now(),n:ed.n.trim(),c:[ed.c],q:false,u:1,pre:'',ex:[],w:ed.ws.map(w=>[w.l,w.i])},L2=LS.get('mp_custom',[]),i=L2.findIndex(x=>x.id==rec.id);i>=0?L2[i]=rec:L2.push(rec);LS.set('mp_custom',L2);location.hash='#/r/'+rec.id}
route();
try{const l=document.createElement('link');l.rel='icon';l.href='data:image/svg+xml,'+encodeURIComponent(LOGO);document.head.appendChild(l)}catch(e){}
</script></body></html>
